<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>守成クラブみゆき通り</title>
  <style>
    :root { --bg: #f4f8fc; --card: #fff; --text: #0f172a; --muted: #526070; --line: #d9e4ef; --blue-dark: #073f93; --shadow: 0 16px 40px rgba(15, 23, 42, 0.08); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; background: linear-gradient(180deg, #fff 0%, var(--bg) 100%); color: var(--text); }
    .page { width: min(100%, 760px); margin: 0 auto; padding: 28px 16px 56px; }
    .back-link { display: inline-flex; margin-bottom: 20px; color: var(--blue-dark); font-size: 14px; font-weight: 800; text-decoration: none; }
    .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 22px; box-shadow: var(--shadow); }
    .eyebrow { margin: 0 0 12px; color: var(--blue-dark); font-size: 13px; font-weight: 800; }
    h1 { margin: 0; font-size: clamp(30px, 8vw, 46px); line-height: 1.14; letter-spacing: 0; }
    .info { display: grid; gap: 10px; margin-top: 20px; }
    .row { display: grid; gap: 4px; padding: 14px; border-radius: 8px; background: #f8fbff; }
    .label { color: var(--muted); font-size: 12px; font-weight: 800; }
    .value { font-size: 15px; font-weight: 700; }
    h2 { margin: 22px 0 8px; font-size: 20px; }
    .empty { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="index.html">‹ コミュニティ一覧へ戻る</a>
    <section class="panel">
      <p class="eyebrow">コミュニティ</p>
      <h1>守成クラブみゆき通り</h1>
      <div class="info">
        <div class="row"><span class="label">開催日時</span><span class="value">未定</span></div>
        <div class="row"><span class="label">開催場所</span><span class="value">未定</span></div>
      </div>
      <h2>メンバー一覧</h2>
      <p class="empty">準備中</p>
    </section>
  </main>
</body>
</html>
