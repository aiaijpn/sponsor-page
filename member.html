<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>メンバー紹介</title>
  <style>
    :root {
      --bg: #f4f8fc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #526070;
      --line: #d9e4ef;
      --blue: #0b5ed7;
      --blue-dark: #073f93;
      --soft-blue: #eaf3ff;
      --black: #111827;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .page {
      width: min(100%, 820px);
      margin: 0 auto;
      padding: 28px 16px 56px;
    }

    .back-link {
      display: inline-flex;
      margin-bottom: 20px;
      color: var(--blue-dark);
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .profile {
      padding: 22px;
    }

    .genre {
      width: fit-content;
      margin: 0 0 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--soft-blue);
      color: var(--blue-dark);
      font-size: 12px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      color: var(--black);
      font-size: clamp(30px, 8vw, 48px);
      line-height: 1.14;
      letter-spacing: 0;
    }

    .meta {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .lead {
      margin: 16px 0 0;
      color: #334155;
      font-size: 15px;
      line-height: 1.85;
    }

    .video-section {
      margin-top: 18px;
      padding: 22px;
      border: 2px solid rgba(11, 94, 215, 0.18);
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #f3f8ff 100%);
      box-shadow: 0 18px 42px rgba(11, 94, 215, 0.12);
    }

    .section-label {
      margin: 0 0 10px;
      color: var(--blue-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .video-section h2,
    .content-section h2,
    .links-section h2 {
      margin: 0;
      color: var(--black);
      font-size: 22px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .video-description,
    .content-text {
      margin: 12px 0 0;
      color: #334155;
      font-size: 15px;
      line-height: 1.85;
      white-space: pre-line;
    }

    .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 54px;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 12px 26px rgba(11, 94, 215, 0.24);
    }

    .links-section,
    .content-section,
    .state {
      margin-top: 18px;
      padding: 20px;
    }

    .link-grid {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .support-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 50px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
    }

    .support-link::after {
      content: "›";
      color: var(--blue);
      font-size: 20px;
      font-weight: 900;
    }

    .state {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .hidden {
      display: none;
    }

    @media (min-width: 720px) {
      .primary-button {
        width: auto;
        min-width: 220px;
      }

      .link-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="ginza-six.html">‹ メンバー一覧へ戻る</a>

    <section id="loadingState" class="panel state">読み込み中です。</section>
    <section id="errorState" class="panel state hidden"></section>

    <article id="memberContent" class="hidden">
      <section class="panel profile" aria-labelledby="memberName">
        <p id="memberGenre" class="genre hidden"></p>
        <h1 id="memberName">メンバー紹介</h1>
        <p id="memberMeta" class="meta hidden"></p>
        <p id="memberLead" class="lead hidden"></p>
      </section>

      <section id="videoSection" class="video-section hidden" aria-labelledby="videoTitle">
        <p class="section-label">紹介動画</p>
        <h2 id="videoTitle">紹介動画</h2>
        <p id="videoDescription" class="video-description hidden"></p>
        <a id="videoButton" class="primary-button" href="#" target="_blank" rel="noopener noreferrer">紹介動画を見る</a>
      </section>

      <section id="linksSection" class="panel links-section hidden" aria-labelledby="linksTitle">
        <h2 id="linksTitle">関連リンク</h2>
        <div id="supportLinks" class="link-grid"></div>
      </section>

      <section id="businessSection" class="panel content-section hidden" aria-labelledby="businessTitle">
        <h2 id="businessTitle">事業内容</h2>
        <p id="businessText" class="content-text"></p>
      </section>

      <section id="detailSection" class="panel content-section hidden" aria-labelledby="detailTitle">
        <h2 id="detailTitle">紹介文</h2>
        <p id="detailText" class="content-text"></p>
      </section>

      <section id="examplesSection" class="panel content-section hidden" aria-labelledby="examplesTitle">
        <h2 id="examplesTitle">対応できること</h2>
        <p id="examplesText" class="content-text"></p>
      </section>
    </article>
  </main>

  <script src="js/member.js"></script>
</body>
</html>
