<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>コミュニティ入口</title>
  <style>
    :root {
      --bg: #f4f8fc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #526070;
      --line: #d9e4ef;
      --blue: #0b5ed7;
      --blue-dark: #073f93;
      --soft-blue: #eaf3ff;
      --black: #111827;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 54%, #ffffff 100%);
      color: var(--text);
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 32px 16px 56px;
    }

    .hero {
      padding: 18px 0 24px;
    }

    .eyebrow {
      display: inline-flex;
      margin: 0 0 14px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--blue-dark);
      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      color: var(--black);
      font-size: clamp(32px, 9vw, 48px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .lead {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .community-list {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .community-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 74px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--black);
      text-decoration: none;
      box-shadow: var(--shadow);
    }

    .community-card:focus-visible {
      outline: 3px solid rgba(11, 94, 215, 0.28);
      outline-offset: 3px;
    }

    .community-name {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.45;
    }

    .arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: var(--soft-blue);
      color: var(--blue);
      font-size: 20px;
      font-weight: 900;
    }

    .footer {
      margin-top: 30px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    @media (min-width: 720px) {
      .community-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">コミュニティ別の入口</p>
      <h1 id="page-title">つながり先を選ぶ</h1>
      <p class="lead">参加している会や気になるコミュニティから、相談先の一覧へ進めます。</p>
    </section>

    <nav class="community-list" aria-label="コミュニティ一覧">
      <a class="community-card" href="ginza-six.html">
        <span class="community-name">守成クラブ銀座シックス</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="community-card" href="ginza-higashi.html">
        <span class="community-name">守成クラブ銀座東</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="community-card" href="ginza.html">
        <span class="community-name">守成クラブ銀座</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="community-card" href="miyuki-dori.html">
        <span class="community-name">守成クラブみゆき通り</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="community-card" href="ginza-nobunaga.html">
        <span class="community-name">守成クラブ銀座のぶなが</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="community-card" href="yabuki-fanclub.html">
        <span class="community-name">矢吹ファンクラブ</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="community-card" href="highclass-joshikai.html">
        <span class="community-name">ハイクラス女子会</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </nav>

    <p class="footer">各コミュニティのページから、相談先やLINEの栄一ツールへ進めます。</p>
  </main>
</body>
</html>
